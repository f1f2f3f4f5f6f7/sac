<section id="rendicion">
  <p-dataview
    #dv
    [value]="inventario"
    [sortOrder]="sortOrder"
    [sortField]="sortField"
    filterBy="inventario"
    [rows]="10"
    layout="grid"
    [paginator]="true"
  >
    <ng-template #header>
      <div class="flex flex-col md:flex-row md:justify-between">
        <p-select
          [options]="sortOptions"
          [(ngModel)]="sortKey"
          placeholder="¿Está inventariado?"
          (onChange)="onSortChange($event)"
          class="mb-2 md:mb-0"
        />
        <div class="flex flex-row md:flex-row justify-between">
          <p-iconfield class="w-full">
            <p-inputicon class="pi pi-search" />
            <input
              class="mr-3 w-[98%]"
              pInputText
              type="text"
              [(ngModel)]="globalQuery"
              (ngModelChange)="dv.filter($event)"
              placeholder="Buscar..."
            />
          </p-iconfield>
          <app-barcode-reader (dataSent)="getBarcodeNumber($event)"></app-barcode-reader>
        </div>
      </div>
    </ng-template>
    <ng-template #grid let-inventario>
      <div class="grid grid-cols-12 gap-4 grid-nogutter">
        @for (item of inventario; track $index; let first = $first) {
        <div class="col-span-12">
          <div class="flex flex-col sm:flex-row sm:items-center p-6 gap-4">
            <div class="relative">
              <p-image
                class="w-full"
                src="https://primefaces.org/cdn/primeng/images/demo/product/bamboo-watch.jpg"
                alt="Image"
                [preview]="true"
                imageClass="w-full"
              />

              <p-tag
                [value]="returnSeveriryLabel(item.inventoried)"
                [severity]="getSeverity(item)"
                class="dark:!bg-surface-900 absolute"
                [style.left.px]="4"
                [style.top.px]="4"
              />
            </div>
            <div class="flex flex-col md:flex-row justify-between md:items-center flex-1 gap-6">
              <div class="flex flex-row md:flex-col justify-between items-start gap-2">
                <div>
                  <span class="font-medium text-secondary text-sm">{{ item.categoria }}</span>
                  <div class="text-lg font-medium text-surface-900 dark:text-surface-0 mt-2">
                    {{ item.descripcion }}
                  </div>
                </div>
              </div>
              <div class="flex flex-col md:items-end gap-8">
                <span class="text-xl font-semibold text-surface-900 dark:text-surface-0"
                  >Inventario: {{ item.inventario }}</span
                >
                <div class="flex flex-row-reverse md:flex-row gap-2">
                  <!-- <p-button icon="pi pi-heart" [outlined]="true" /> -->
                  <p-button
                    icon="pi pi-box"
                    class="flex-auto md:flex-initial whitespace-nowrap w-full"
                    styleClass="w-full"
                    label="{{ item.inventoried ? 'Corregir' : 'Inventariar' }}"
                    (click)="openInventaryDialog(item)"
                  />
                </div>
              </div>
            </div>
          </div>
        </div>
        }
      </div>
    </ng-template>
  </p-dataview>
  <p-dialog
    header="Inventariar Item"
    [modal]="true"
    [(visible)]="visible"
    [style]="{ width: '30rem' }"
    (onShow)="onShowDialog()"
    (onHide)="closeDialog()"
  >
    <section id="camera">
      @if (!cameraStarted) {
      <div id="spinner" class="card flex justify-center">
        <p-progress-spinner
          strokeWidth="8"
          fill="transparent"
          animationDuration=".5s"
          [style]="{ width: '50px', height: '50px' }"
        />
      </div>
      }
      <video id="video"></video>
      <canvas id="canvas">
        <img src="" class="photo" alt="photo" />
      </canvas>
      @if(cameraStarted){
      <div class="flex md:flex-row gap-2 mt-2">
        <p-button
          class="w-full"
          styleClass="w-full"
          [severity]="retake ? 'contrast' : 'primary'"
          (onClick)="retake ? videoStream() : takePhoto()"
          >{{ retake ? 'Retomar Foto' : 'Tomar Foto' }}</p-button
        >
      </div>
      }
    </section>
  </p-dialog>
</section>
