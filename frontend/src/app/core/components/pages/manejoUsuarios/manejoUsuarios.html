<p-toast></p-toast>
<p-confirmDialog></p-confirmDialog>

<div class="users-container">

  <div class="header">
    <h2>Gestión de Usuarios</h2>

    <div class="flex flex-row md:flex-row justify-between items-center gap-5">
      <p-iconfield class="flex-1">
        <p-inputicon class="pi pi-search" />
        <input
          class="w-full"
          pInputText
          type="text"
          [(ngModel)]="globalQuery"
          (input)="dt.filterGlobal($event.target.value, 'contains')"
          placeholder="Buscar usuario..."
        />
      </p-iconfield>

      <button pButton 
              icon="pi pi-user-plus" 
              label="Nuevo"
              class="p-button-rounded"
              style="min-width: 150px; padding-left: 1.5rem; padding-right: 1.5rem;"
              [style]="{'background-color': '#1e3a8a', 'border-color': '#1e3a8a', 'min-width': '100px', 'padding-left': '1.5rem', 'padding-right': '1.5rem'}"
              (click)="openNew()">
      </button>
    </div>
  </div>

  <p-card>
    <p-table #dt 
             [value]="users" 
             responsiveLayout="scroll" 
             [loading]="loading"
             [globalFilterFields]="['name', 'codigo', 'email', 'escuela.nombre']">

      <ng-template pTemplate="header">
        <tr>
          <th style="width:60px">#</th>
          <th>Nombre</th>
          <th>Código</th>
          <th>Email</th>
          <th>Escuela</th>
          <th style="width:120px">Acciones</th>
        </tr>
      </ng-template>

      <ng-template pTemplate="body" let-user let-index="rowIndex">
        <tr>
          <td>{{ index + 1 }}</td>
          <td>{{ user.name }}</td>
          <td>{{ user.codigo }}</td>
          <td>{{ user.email }}</td>
          <td>{{ user.escuela?.nombre || 'Sin escuela' }}</td>
          <td>
            <button pButton 
                    icon="pi pi-trash"
                    class="p-button-rounded p-button-danger p-button-text"
                    (click)="deleteUser(user)">
            </button>
          </td>
        </tr>
      </ng-template>

      <ng-template pTemplate="emptymessage">
        <tr>
          <td colspan="6" class="text-center">
            <p *ngIf="!loading">No hay usuarios registrados</p>
          </td>
        </tr>
      </ng-template>

    </p-table>
  </p-card>

</div>
<!-- MODAL -->
<p-dialog header="Nuevo Usuario"
          [(visible)]="userDialog"
          [modal]="true"
          [style]="{width:'420px'}">

  <div class="form">

    <div class="field">
      <label>Código</label>
      <input pInputText [(ngModel)]="newUser.codigo" placeholder="Ej: 555555" />
    </div>

    <div class="field">
      <label>Nombre</label>
      <input pInputText [(ngModel)]="newUser.nombre" placeholder="Nombre completo" />
    </div>

    <div class="field">
      <label>Email</label>
      <input pInputText type="email" [(ngModel)]="newUser.email" placeholder="email@ejemplo.com" />
    </div>

    <div class="field">
      <label>Contraseña</label>
      <p-password [(ngModel)]="newUser.password" [feedback]="false" placeholder="Mínimo 6 caracteres" styleClass="w-full"></p-password>
    </div>

  </div>

  <ng-template pTemplate="footer">
    <button pButton label="Cancelar" 
            class="p-button-text" 
            [disabled]="saving"
            (click)="userDialog=false"></button>

    <button pButton label="Guardar" 
            class="p-button-success" 
            [disabled]="saving"
            [loading]="saving"
            (click)="saveUser()"></button>
  </ng-template>

</p-dialog>
