<p-toast />

<section class="body p-4">
  <div class="flex justify-content-center">
    <div class="w-full" style="max-width: 1200px">
      <!-- ================================================= -->
      <!--   PANEL SUPERIOR: BÚSQUEDA + LECTOR DE CÓDIGO    -->
      <!-- ================================================= -->
      <p-card styleClass="mb-4 shadow-2 border-round-lg">
        <div class="text-center mb-3">
          <h2 class="m-0">Buscar Inventario</h2>
        </div>

        <div class="flex justify-content-center align-items-center gap-4 mb-3">
          <!-- INPUT DE BÚSQUEDA -->
          <p-floatlabel variant="on" style="flex: 0 1 max-width: 500px; width: 100%;">
            <p-iconfield>
              <p-inputicon class="pi pi-search" />
              <input
                pInputText
                id="on_label"
                [(ngModel)]="globalQuery"
                autocomplete="off"
                (keyup.enter)="buscar()"
                style="width: 80%"
              />
            </p-iconfield>

            <label for="on_label">Buscar código...</label>
          </p-floatlabel>

          <!-- BOTÓN DE BÚSQUEDA -->
          <p-button label="Buscar" icon="pi pi-search" (onClick)="buscar()" [loading]="loading">
          </p-button>

          <!-- LECTOR DE CÓDIGO -->
          <app-barcode-reader (dataSent)="getBarcodeNumber($event)"></app-barcode-reader>
        </div>
      </p-card>

      <!-- ================================================= -->
      <!--   SPLITTER -->
      <!-- ================================================= -->
      <p-splitter
        [panelSizes]="[30, 70]"
        styleClass="mb-6 border-round-2xl shadow-3 overflow-hidden"
        [ngStyle]="{ height: '400px', 'border-radius': '1.5rem' }"
      >
        <!-- PANEL IZQUIERDO -->
        <ng-template pTemplate="panel">
          <div class="w-full h-full p-4 flex justify-content-center">
            <!-- Contenedor ajustado -->
            <div class="w-full" style="max-width: 500px">
              <!-- Título -->
              <div class="text-center mb-3">
                <h3 class="mt-2 mb-1">Foto del Ítem</h3>
                <p-divider></p-divider>
              </div>

              <!-- Panel Foto Mejorado y Responsive -->
              <p-panel styleClass="w-full p-3 border-round-2xl surface-card">

                <div
                  class="flex justify-content-center align-items-center"
                  style="min-height: 200px; width: 100%"
                >
                  @if (resultado && resultado.foto_url) {
                  <p-image
                    [src]="resultado.foto_url"
                    alt="Foto del inventario"
                    [preview]="true"
                    styleClass="border-round-xl"
                    [ngStyle]="{
                      width: '100%',
                      height: 'auto',
                      'max-height': '225px',
                      'object-fit': 'contain'
                    }"
                  />
                  }
                </div>
              </p-panel>
            </div>
          </div>
        </ng-template>

        <!-- PANEL DERECHO -->
        <ng-template pTemplate="panel">
          <div class="w-full h-full p-4 flex justify-content-center overflow-auto">
            <!-- Contenedor principal -->
            <div class="w-full" style="max-width: 850px">
              <!-- Título -->
              <div class="text-center mb-3">
                <h3 class="mt-2 mb-1">Información General</h3>
                <p-divider></p-divider>
              </div>

              @if (resultado) {
              <!-- Panel de Información General -->
              <p-panel styleClass="border-round-xl shadow-2">
                <p-table
                  [value]="[resultado]"
                  [rows]="1"
                  [paginator]="false"
                  styleClass="w-full text-center"
                >
                  <ng-template pTemplate="body" let-item>
                    <tr>
                      <td><strong>Recibido por</strong></td>
                      <td>{{ item.recibido_por ?? 'N/A' }}</td>
                    </tr>
                    <tr>
                      <td><strong>Ubicación</strong></td>
                      <td>{{ item.ubicacion ?? 'N/A' }}</td>
                    </tr>
                    <tr>
                      <td><strong>Escuela</strong></td>
                      <td>{{ item.escuela ?? 'N/A' }}</td>
                    </tr>
                  </ng-template>
                </p-table>
              </p-panel>
              } @else if (error && globalQuery) {
              <div class="flex justify-content-center">
                <p-message
                  severity="error"
                  [text]="error"
                  styleClass="w-full"
                  [ngStyle]="{ 'max-width': '600px' }"
                />
              </div>
              }
            </div>
          </div>
        </ng-template>
      </p-splitter>
    </div>
  </div>
</section>
